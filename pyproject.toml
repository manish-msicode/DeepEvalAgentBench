[project]
name = "eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mnissh", email = "manishtungariya98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3.1",
    "dotenv>=0.9.9",
    "groq<1.0.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "openai>=3.35.1",
    "portalocker[win32]>=4.4.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
    "test-py>=0.3",
]

[project.scripts]
eval = "eval:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "agent",
]
